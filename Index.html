    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #E60012;
            --dark-red: #8B0000;
            --black: #000000;
            --dark-gray: #0a0a0a;
            --silver: #C0C0C0;
            --chrome: linear-gradient(135deg, #e0e0e0 0%, #ffffff 50%, #a0a0a0 100%);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--black);
            color: #fff;
            overflow-x: hidden;
        }

        /* CINEMATIC LETTERBOX */
        .letterbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .letterbox-top, .letterbox-bottom {
            position: absolute;
            width: 100%;
            height: 8vh;
            background: var(--black);
            transition: height 1s ease;
        }

        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        /* SCENE 1: THE VOID */
        #scene-void {
            height: 100vh;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .breathing-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1rem;
            color: var(--primary-red);
            opacity: 0;
            animation: breathe 4s ease-in-out infinite;
            text-transform: uppercase;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.1; transform: scale(0.95); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }

        .electrical-hum {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, var(--black) 70%);
            animation: pulse-hum 3s ease-in-out infinite;
        }

        @keyframes pulse-hum {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* SCENE 2: FIRST BREATH */
        #scene-first-breath {
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a0000 0%, var(--black) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .controller-reveal {
            position: relative;
            width: 600px;
            height: 400px;
            perspective: 1000px;
        }
